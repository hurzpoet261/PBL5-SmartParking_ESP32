[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = huge_app.csv
board_build.f_flash = 80000000L

; === THÊM 2 DÒNG NÀY ĐỂ FIX LỖI ĐẾ MB BỊ KẸT ===
monitor_rts = 0
monitor_dtr = 0

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
